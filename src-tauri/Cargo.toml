[package]
name = "HeraVex"
version = "1.0.0"
description = "HeraVex desktop shell"
authors = ["mucah"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
printpdf = "0.7"
pulldown-cmark = { version = "0.12", default-features = false }
notify = "6"
notify-debouncer-mini = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-single-instance = "2"

# Settings → Privacy "Encrypt with OS keychain": Windows Credential
# Manager / macOS Keychain. Linux needs the Secret Service (D-Bus) for a
# persistent store, so the option is reported unsupported there.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
