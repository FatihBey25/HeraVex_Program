name: "Build Linux"

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust Kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Linux Gerekli Kütüphaneler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Frontend Paketlerini Yükle
        run: npm install

      - name: Tauri Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.8.5-linux
          releaseName: "HeraVex v0.8.5 (Linux)"
          releaseDraft: true
          prerelease: false